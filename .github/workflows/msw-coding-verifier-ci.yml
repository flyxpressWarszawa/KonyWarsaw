name: MSW coding verifier - offline contracts

on:
  pull_request:
    branches: ['msw/github-verification-20261107', 'msw/engine-runtime-20261104']
    paths: ['msw-autonomous-engine/**', '.github/workflows/msw-coding-verifier-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify file identity and the real worker lifecycle with offline ports
        working-directory: msw-autonomous-engine
        run: |
          python -m unittest discover -s tests -p 'test_github_verify.py' -v
          python -m unittest discover -s tests -p 'test_github_worker_integration.py' -v
          python -m unittest discover -s tests -p 'test_coding_verify.py' -v
