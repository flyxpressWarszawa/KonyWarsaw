name: MSW public technical knowledge - daily
on:
  schedule:
    - cron: '19 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: msw-public-research-main
  cancel-in-progress: false
jobs:
  public-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source parser and safety controls
        run: python -m unittest discover -s msw-research-engine/tests -v
      - name: Synchronize public OpenAlex, CISA and CIS metadata
        run: python msw-research-engine/sync.py
      - name: Commit public snapshot to separate directory
        run: |
          git config user.name 'msw-public-intelligence[bot]'
          git config user.email 'msw-public-intelligence@users.noreply.github.com'
          git add msw-research-engine/data/latest.json
          if git diff --cached --quiet; then
            echo 'No public metadata changes'
            exit 0
          fi
          git commit -m 'data: refresh public technical intelligence metadata'
          git push origin HEAD:main
