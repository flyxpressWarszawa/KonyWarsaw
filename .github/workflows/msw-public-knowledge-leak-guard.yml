name: MSW security - deny new public knowledge archive files

# Prevent accidental merge of new MSW owner knowledge into PUBLIC main.
# Does not purge old commits or guarantee that another branch is private.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prevent-new-private-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source revision without credential persistence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject new or modified sensitive archive paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'No reliable base SHA: abstain from a privacy approval'
            exit 1
          fi
          violating=0
          while IFS=$'\t' read -r change path; do
            case "$path" in
              msw-autonomous-engine/knowledge/*|docs/hermes/knowledge/*|knowledge/archive/*|MSW-PRIVATE-ARCHIVE*)
                case "$change" in
                  D*) : ;; # deleting exposed material is explicitly allowed
                  *) violating=1 ;;
                esac ;;
            esac
          done < <(git diff --name-status "$BASE_SHA" "$HEAD_SHA" --)
          if [ "$violating" -ne 0 ]; then
            echo 'BLOCKED: owner knowledge belongs in the PRIVATE signal-harbor-companion repository.'
            exit 1
          fi
          echo 'No newly added or modified protected archive paths.'
