name: MSW Qwen audit offline safeguards
on:
  push:
    branches:
      - msw/qwen-audit-offline-contracts-20261110
      - msw/heartbeat-lease-failclosed-20261111
  pull_request:
    branches:
      - msw/engine-runtime-20261104
      - msw/qwen-audit-offline-contracts-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-reproductions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile offline tests and worker
        run: python -m compileall -q msw-autonomous-engine/msw_engine msw-autonomous-engine/tests/test_qwen_audit_offline.py
      - name: Run bounded mocked reproductions
        env:
          PYTHONPATH: msw-autonomous-engine
        run: |
          python -m unittest discover -s msw-autonomous-engine/tests -p test_qwen_audit_offline.py -v
          python -m unittest discover -s msw-autonomous-engine/tests -p test_paid_attempt_safety.py -v
          python -m unittest discover -s msw-autonomous-engine/tests -p test_paid_concurrent_http.py -v
          python -m unittest discover -s msw-autonomous-engine/tests -p test_php_paid_lease_proposal.py -v
          python -m unittest discover -s msw-autonomous-engine/tests -p test_recovery.py -v
          python -m unittest discover -s msw-autonomous-engine/tests -p test_priority_lane.py -v
          python -m unittest discover -s msw-autonomous-engine/tests -p test_shutdown.py -v
          python -m unittest discover -s msw-autonomous-engine/tests -p test_suite.py -v
