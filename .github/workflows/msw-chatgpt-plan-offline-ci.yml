name: MSW ChatGPT Plan OAuth adapter (offline)
on:
  pull_request:
    branches:
      - msw/worker-autostart-final-20261111
    paths:
      - 'msw-autonomous-engine/msw_engine/chatgpt_plan.py'
      - 'msw-autonomous-engine/msw_engine/tasks.py'
      - 'msw-autonomous-engine/tests/test_chatgpt_plan.py'
      - '.github/workflows/msw-chatgpt-plan-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests (no external API calls or secrets)
        working-directory: msw-autonomous-engine
        env:
          MSW_CHATGPT_PLAN_ENABLED: '0'
        run: python -m unittest discover -s tests -p 'test_chatgpt_plan.py' -v
