name: MSW coding task executor - offline verification

on:
  pull_request:
    branches: [main, msw/coding-bridge-contract-20261107]
    paths:
      - msw-github-engine/**
      - msw-coding-bridge/**
      - .github/workflows/msw-coding-task*
      - .github/aw/actions-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msw-coding-task-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact proposal without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install the pinned workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Obtain the exact official compiler and verify its digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          url = 'https://github.com/github/gh-aw/releases/download/v1.0.1/linux-amd64'
          with urllib.request.urlopen(url, timeout=45) as response:
              data = response.read(49623201)
          if len(data) != 49623200 or hashlib.sha256(data).hexdigest() != '746d0b41d5fb87e2c010b8ac23a464436bb745ff89fbd19a3456431942c37652':
              raise SystemExit('Official compiler digest mismatch')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gh-aw-v1.0.1'
          target.write_bytes(data)
          target.chmod(0o755)
          PY
      - name: Compile with strict checks and verify the committed lock
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gh-aw-v1.0.1" compile msw-coding-task \
            --action-mode release --action-tag 0627fdbe4beb5f3b71aa569f8d97150b87f2111a \
            --no-check-update
          git diff --exit-code -- .github/workflows/msw-coding-task.lock.yml
      - name: Verify task preparation, execution HOLD and result readback offline
        run: python -m unittest discover -s msw-github-engine/tests -v
      - name: Verify the actual publication bundle guard offline
        run: node --test msw-github-engine/tests/task-publication.test.cjs
      - name: Verify the shared canonical transport contract
        run: python -m unittest discover -s msw-coding-bridge/tests/python -v
      - name: Check patch whitespace
        run: git diff --check
