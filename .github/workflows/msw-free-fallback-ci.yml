name: MSW free fallback candidate checks
on:
  pull_request:
    branches:
      - msw/worker-autostart-final-20261111
    paths:
      - msw-autonomous-engine/msw_engine/free_fallback.py
      - msw-autonomous-engine/msw_engine/free_transports.py
      - msw-autonomous-engine/msw_engine/federation.py
      - msw-autonomous-engine/msw_engine/openai_direct.py
      - msw-autonomous-engine/msw_engine/aliyun_direct.py
      - msw-autonomous-engine/tests/test_free_fallback.py
      - .github/workflows/msw-free-fallback-ci.yml
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify adapter syntax
        run: python -m compileall -q msw-autonomous-engine/msw_engine
      - name: Verify free-only routing and existing request identity contracts
        working-directory: msw-autonomous-engine
        run: |
          python -m unittest discover -s tests -p test_free_fallback.py -v
          python -m unittest discover -s tests -p test_federation_resume.py -v
          python -m unittest discover -s tests -p test_federation.py -v
          python -m unittest discover -s tests -p test_aliyun_direct.py -v
