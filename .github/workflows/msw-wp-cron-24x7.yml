name: MSW WordPress - 24x7 scheduled task heartbeat

# External trigger for existing WordPress cron queues. The daily public research
# snapshot remains in msw-public-research.yml to protect API budgets.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msw-wp-cron-heartbeat
  cancel-in-progress: false

jobs:
  trigger-due-wordpress-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call WordPress WP-Cron without credentials
        shell: bash
        env:
          WP_CRON_URL: https://mobilny-serwis-warszawa.pl/wp-cron.php
        run: |
          set -euo pipefail
          echo "Triggering WordPress due jobs at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          curl --fail --silent --show-error \
            --retry 2 --retry-connrefused --retry-delay 5 \
            --connect-timeout 10 --max-time 180 \
            --output /dev/null \
            --write-out 'WP-Cron entrypoint HTTP %{http_code} in %{time_total}s\n' \
            "$WP_CRON_URL"
          echo "Entrypoint responded; this does not independently prove every plugin task completed."

      - name: Public research endpoint status (informational)
        if: always()
        shell: bash
        env:
          HEALTH_URL: https://mobilny-serwis-warszawa.pl/wp-json/msw-quantum-mesh/v1/health
        run: |
          set -euo pipefail
          curl --silent --show-error --connect-timeout 8 --max-time 20 \
            --output /dev/null \
            --write-out 'Quantum Mesh health endpoint HTTP %{http_code}\n' \
            "$HEALTH_URL" || true
          echo "Full import verification requires checking the source-specific last-success counters."
